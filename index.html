<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mil Millas Score</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script defer src="app.js"></script>
</head>
<body data-page="index">
  <div class="page-shell">
    <header class="topbar">
      <div class="brand-block">
        <span class="brand-mark">🏁</span>
        <div>
          <p class="eyebrow">Juego de mesa</p>
          <h1>Mil Millas</h1>
        </div>
      </div>
    </header>

    <main class="container">
      <section class="hero card">
        <div class="hero-copy">
          <p class="eyebrow accent">Panel principal</p>
          <h2>Gestión de partidas</h2>
          <p id="resumenPartidasActivas">Cargando partidas activas...</p>
          <p id="resumenPartidasFinalizadas">Cargando partidas finalizadas...</p>
        </div>
        <div class="hero-illustration">
          <img src="images/man-with-laptop.png" alt="Panel de control de Mil Millas" />
        </div>
      </section>

      <section class="dashboard-grid">
        <article class="card list-panel">
          <div class="panel-header">
            <h3>Partidas activas</h3>
          </div>
          <ul id="partidasActivas" class="list-panel-items"></ul>
        </article>

        <article class="card list-panel">
          <div class="panel-header">
            <h3>Partidas finalizadas</h3>
          </div>
          <ul id="partidasFinalizadas" class="list-panel-items"></ul>
        </article>
      </section>

      <section class="card form-panel">
        <div class="panel-header">
          <h3>Nueva partida</h3>
        </div>

        <form id="formNuevaPartida" class="modern-form">
          <label class="field">
            <span>Nombre de la partida</span>
            <input id="nombrePartida" type="text" placeholder="Ej: Viernes de mil millas" required>
          </label>

          <label class="field">
            <span>Modo de juego</span>
            <select id="modoJuego">
              <option value="individual">Individual</option>
              <option value="equipos">Equipos</option>
            </select>
          </label>

          <div id="camposJugadores" class="participant-fields"></div>

          <button type="submit" class="primary-button">Crear partida</button>
        </form>
      </section>
    </main>
  </div>
</body>
</html>
