<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Partida de Mil Millas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script defer src="app.js"></script>
</head>
<body data-page="partida">
  <div class="page-shell">
    <header class="topbar compact-topbar">
      <a href="index.html" class="back-link">← Volver</a>
    </header>

    <main class="container">
      <section class="card game-card">
        <div class="panel-header compact-header">
          <h1 id="tituloPartida">Partida actual</h1>
        </div>

        <h2 id="subtituloPartida" class="subtitle"></h2>

        <div id="mensajeGanador" class="status-banner success" style="display: none;">
          🎉 ¡Felicidades! El ganador es: <span id="nombreGanador"></span> 🏆
        </div>

        <div id="tablaResumen" class="summary-box"></div>

        <div id="mensajeFinalizada" class="status-banner warning" style="display: none;">
          Esta partida está finalizada. No se pueden agregar más manos.
        </div>

        <div id="agregarManoCard" class="card hand-card">
          <div class="panel-header">
            <h3>Agregar mano</h3>
          </div>

          <form id="formMano" class="modern-form">
            <div id="formJugadores" class="participant-grid"></div>
            <button type="submit" class="primary-button">Guardar mano</button>
          </form>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
